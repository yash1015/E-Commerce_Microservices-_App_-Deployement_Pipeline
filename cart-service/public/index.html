<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart – ShopMS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; color: #333; }

    header {
      background: #2c3e50; color: white; padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.3rem; }
    nav a { color: #ccc; text-decoration: none; margin-left: 16px; font-size: 0.9rem; }
    nav a:hover { color: white; }

    .container { max-width: 750px; margin: 30px auto; padding: 0 20px; }
    h2 { margin-bottom: 20px; font-size: 1.4rem; color: #2c3e50; }

    .empty { text-align: center; padding: 60px 20px; color: #999; font-size: 1rem; }
    .empty span { font-size: 3rem; display: block; margin-bottom: 12px; }

    .cart-item {
      background: white; border-radius: 10px; padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.07);
    }
    .item-info h3 { font-size: 1rem; margin-bottom: 4px; }
    .item-info p { font-size: 0.85rem; color: #888; }
    .item-right { display: flex; align-items: center; gap: 16px; }
    .item-price { font-weight: bold; color: #e74c3c; font-size: 1rem; }
    .remove-btn {
      background: none; border: 1px solid #ccc; color: #e74c3c;
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    }
    .remove-btn:hover { background: #e74c3c; color: white; border-color: #e74c3c; }

    .summary {
      background: white; border-radius: 10px; padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.07); margin-top: 20px;
    }
    .summary-row {
      display: flex; justify-content: space-between;
      padding: 8px 0; font-size: 0.95rem;
    }
    .summary-row.total {
      font-weight: bold; font-size: 1.1rem; border-top: 1px solid #eee;
      padding-top: 14px; margin-top: 6px;
    }
    .btn-checkout {
      width: 100%; margin-top: 16px; padding: 12px;
      background: #e74c3c; color: white; border: none;
      border-radius: 8px; font-size: 1rem; cursor: pointer;
    }
    .btn-checkout:hover { background: #c0392b; }
    .btn-clear {
      width: 100%; margin-top: 10px; padding: 10px;
      background: none; color: #999; border: 1px solid #ddd;
      border-radius: 8px; font-size: 0.9rem; cursor: pointer;
    }
    .btn-clear:hover { border-color: #e74c3c; color: #e74c3c; }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #27ae60; color: white; padding: 12px 20px;
      border-radius: 8px; font-size: 0.9rem; display: none;
    }
  </style>
</head>
<body>

<header>
  <h1>🛒 ShopMS – Cart</h1>
  <nav>
    <a href="http://localhost:3000">🏠 Home</a>
    <a href="http://localhost:3001">🛍️ Products</a>
    <a href="http://localhost:3003">📦 Orders</a>
  </nav>
</header>

<div class="container">
  <h2>Your Cart</h2>
  <div id="cart-items"></div>
  <div id="summary"></div>
</div>

<div class="toast" id="toast">✅ Order placed!</div>

<script>
  async function loadCart() {
    const res = await fetch('/api/cart');
    const cart = await res.json();
    render(cart);
  }

  function render(cart) {
    const itemsDiv = document.getElementById('cart-items');
    const summaryDiv = document.getElementById('summary');

    if (cart.length === 0) {
      itemsDiv.innerHTML = `<div class="empty"><span>🛒</span>Your cart is empty.<br><a href="http://localhost:3001">Browse products →</a></div>`;
      summaryDiv.innerHTML = '';
      return;
    }

    itemsDiv.innerHTML = cart.map(item => `
      <div class="cart-item">
        <div class="item-info">
          <h3>${item.name}</h3>
          <p>Qty: ${item.quantity} × $${item.price.toFixed(2)}</p>
        </div>
        <div class="item-right">
          <span class="item-price">$${(item.quantity * item.price).toFixed(2)}</span>
          <button class="remove-btn" onclick="removeItem(${item.productId})">Remove</button>
        </div>
      </div>
    `).join('');

    const subtotal = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
    const shipping = subtotal > 0 ? 5.00 : 0;
    const total = subtotal + shipping;

    summaryDiv.innerHTML = `
      <div class="summary">
        <div class="summary-row"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
        <div class="summary-row"><span>Shipping</span><span>$${shipping.toFixed(2)}</span></div>
        <div class="summary-row total"><span>Total</span><span>$${total.toFixed(2)}</span></div>
        <button class="btn-checkout" onclick="placeOrder(${total.toFixed(2)})">Place Order</button>
        <button class="btn-clear" onclick="clearCart()">Clear Cart</button>
      </div>
    `;
  }

  async function removeItem(productId) {
    await fetch(`/api/cart/${productId}`, { method: 'DELETE' });
    loadCart();
  }

  async function clearCart() {
    await fetch('/api/cart', { method: 'DELETE' });
    loadCart();
  }

  async function placeOrder(total) {
    const cartRes = await fetch('/api/cart');
    const cart = await cartRes.json();
    if (cart.length === 0) return;

    // Send order to order service
    await fetch('http://localhost:3003/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: cart, total })
    });

    // Clear cart
    await fetch('/api/cart', { method: 'DELETE' });

    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => {
      toast.style.display = 'none';
      window.location.href = 'http://localhost:3003';
    }, 1500);
  }

  loadCart();
</script>
</body>
</html>
